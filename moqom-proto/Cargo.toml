[package]
name = "moqom-proto"
description = "Sans-io codec for Media over QUIC Transport (draft-ietf-moq-transport-19)"
version = "0.0.0"
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
