[package]
name = "moqom-client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
license = "Apache-2.0"
description = "A MOQT subscriber and publisher, for recorders, classifiers, and the CLI"

[dependencies]
moqom-proto = { path = "../moqom-proto" }
moqom-transport = { path = "../moqom-transport" }
# For the device key and the proof it signs. Already the provider rustls and
# quinn are built against here, so this adds an API rather than a library.
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
url = { workspace = true }
web-transport-quinn = { workspace = true }
webpki-roots = "0.26"
# Direct paths: each endpoint presents an ephemeral certificate its peer pins.
rcgen = { workspace = true }
# Direct paths: turning `IPV6_V6ONLY` off before the bind, for one dual-stack socket. Already in
# the tree beneath quinn-udp and moqom-transport.
socket2 = { workspace = true }

[dev-dependencies]
moqom-relay = { path = "../moqom-relay" }
# Adds the negotiated key exchange group to quinn's handshake data, which is how the post-quantum
# tests read it. Unlike quinn's feature of the same name this one does not also switch on rustls's
# post-quantum preference, so the tests see what the build itself chose.
quinn-proto = { workspace = true, features = ["__rustls-post-quantum-test"] }
rcgen = { workspace = true }
rustls = { workspace = true }
# Minting a token in the possession test, where the claim shape is what the Go
# control plane produces and writing it by hand invites a typo that reads as a
# verification bug.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
