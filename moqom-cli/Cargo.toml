[package]
name = "moqom-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
license = "Apache-2.0"
description = "Command-line MOQT subscriber and publisher, using only moqom-client"

[[bin]]
name = "moqom"
path = "src/main.rs"

[dependencies]
moqom-client = { path = "../moqom-client" }
moqom-media = { path = "../moqom-media", features = ["clap"] }
bytes = { workspace = true }
clap = { workspace = true }
# `time` paces a file at its frame rate, and `signal` is what lets a subscriber
# writing a file be stopped with C-c and still have a playable one.
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "io-util",
  "io-std",
  "time",
  "signal",
  "fs",
] }

[lints]
workspace = true
