[package]
name = "moqom-relay"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
# BUSL-1.1: the relay is the service half of the licence split. See LICENSING.md.
license = "BUSL-1.1"
description = "A MOQT relay: session state, subscription matching, and fan-out"

[dependencies]
moqom-proto = { path = "../moqom-proto" }
moqom-transport = { path = "../moqom-transport" }
# The device key and the proof it signs, for an edge's links to its parent: the
# same proof a client makes, so a parent checks a link exactly as it checks one.
moqom-client = { path = "../moqom-client" }
bytes = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "signal", "net"] }
tracing = { workspace = true }
web-transport-quinn = { workspace = true }
url = { workspace = true }
webpki-roots = "0.26"

# Verifying the credential a session presents. aws-lc-rs supplies ML-DSA-65 and is
# already here as the rustls provider, so the signature check costs no new
# cryptography; serde reads the claims, which are JSON precisely so that the
# media-path binary does not have to carry a CBOR/COSE stack.
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Binary only. A relay in production is given a certificate; these are what let
# it generate one for a test harness or a laptop, and print the hash to pin.
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
tracing-subscriber = { workspace = true }

# The link to the control plane, which is gRPC because the control plane is Go
# and the contract is protobuf. It is the one place a relay speaks anything but
# MOQT, and it is deliberately nowhere near the media path: a session is
# authorised against state this link delivered earlier, never by asking it
# during a handshake.
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "router", "server", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
tokio-stream = "0.1"
http = "1"

# Usage reports to the billing endpoint, which is plain HTTPS rather than the
# link's gRPC. Already in the tree beneath tonic, so this adds code rather than
# libraries, and it is the client the recorder uses for its object store.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"

# TLS on the admin port, for client certificates from an operator authority.
# Already in the tree beneath tonic; features off so it adds no second crypto
# provider -- the configuration it is handed names aws-lc-rs explicitly.
tokio-rustls = { version = "0.26", default-features = false }

[build-dependencies]
# Only used when MOQOM_REGENERATE_PROTO is set. The output is checked in so that
# building a relay needs no protoc.
tonic-prost-build = "0.14"

# Reading the kernel's clock discipline through adjtimex, which std does not
# expose. Linux only: nothing else is a deployment target, and off Linux the
# relay reports that it cannot tell rather than guessing.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
url = { workspace = true }

[[bin]]
name = "moqom-relay"
path = "src/bin/relay.rs"
