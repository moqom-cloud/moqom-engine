[package]
name = "moqom-recorder"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
# BUSL-1.1: the hosted recorder is a service, on the relay's side of the licence
# split. See LICENSING.md. What it writes is documented in docs/RECORDING.md so a
# customer can read their own files without linking this.
license = "BUSL-1.1"
description = "A hosted MOQT recorder: joins a room as a recording watchdog and archives what it receives"

[dependencies]
moqom-client = { path = "../moqom-client" }
moqom-proto = { path = "../moqom-proto" }
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["env"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
webpki-roots = "0.26"

# The object store's HTTP API. Every one of these is already in the tree beneath
# tonic, so the GCS client below adds code rather than libraries; a cloud SDK
# would add a few hundred crates to do four requests.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http = "1"
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false }

# The recorder link to the control plane: gRPC, the same stack and features the
# relay's link uses, so the two binaries share one build of it.
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "router", "server", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
tokio-stream = "0.1"

[build-dependencies]
# Only used when MOQOM_REGENERATE_PROTO is set. The output is checked in.
tonic-prost-build = "0.14"

[dev-dependencies]
moqom-relay = { path = "../moqom-relay" }
moqom-transport = { path = "../moqom-transport" }
aws-lc-rs = { workspace = true }
quinn = { workspace = true }
rcgen = { workspace = true }
url = { workspace = true }
web-transport-quinn = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true

[[bin]]
name = "moqom-recorder"
path = "src/bin/recorder.rs"
