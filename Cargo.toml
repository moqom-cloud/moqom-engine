[workspace]
resolver = "3"
members = [
    "moqom-proto",
    "moqom-rans",
    "moqom-rans-ffi",
    "moqom-direct-ffi",
    "moqom-relay",
    "moqom-transport",
    "moqom-client",
    "moqom-media",
    "moqom-cli",
    "moqom-loadgen",
    "moqom-recorder",
]
# cargo-fuzz needs nightly and links libFuzzer, so it cannot build under the
# pinned stable toolchain the rest of the workspace uses. Excluded rather than
# gated: the same contract it enforces also runs on stable via the property
# tests in moqom-proto::testing, so a stable build loses coverage of hostile
# input depth, not of the invariants themselves.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
authors = ["Elliott Wave LLC"]
repository = "https://github.com/moqom-cloud/moqom-engine"
# No workspace-level `license`: this workspace spans both licence halves.
# Apache-2.0 for the protocol and transport crates, which are what anyone
# building on MOQT links; proprietary (LicenseRef-MOQOM-Proprietary) for the
# relay, recorder and moqom-cc, which are the product. Each crate sets its own, and LICENSING.md is the authoritative map. A
# crate with no `license` field is a bug -- there is no safe default when a
# single workspace spans both.
publish = false

[workspace.dependencies]
bytes = "1"
thiserror = "2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
quinn-proto = { version = "0.11", default-features = false }
# Already in the tree beneath quinn-udp. Named here because the relay binds its own socket to set
# a differentiated services codepoint on it, which quinn offers no way to do through `Endpoint`.
socket2 = "0.6"
web-transport-quinn = { version = "0.11", default-features = false, features = ["aws-lc-rs"] }
# `prefer-post-quantum` puts X25519MLKEM768 first in aws-lc-rs's default key exchange groups, so
# every configuration built from the default provider sends a hybrid key share first and still
# offers X25519 alongside it for a classical peer. Feature unification makes this hold for every
# crate in the build, tonic's gRPC link included, and `moqom-transport` has a test that fails if
# it ever stops.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "prefer-post-quantum"] }
url = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
aws-lc-rs = "1"
# The security libraries, from a sibling checkout until they are published.
moqom-token = { path = "../moqom-security/rust/moqom-token" }
moqom-proof = { path = "../moqom-security/rust/moqom-proof" }
moqom-sframe = { path = "../moqom-security/rust/moqom-sframe" }
moqom-mls = { path = "../moqom-security/rust/moqom-mls" }
base64 = "0.22"
rcgen = "0.14"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux only, and only for `adjtimex`. The relay needs the kernel's own bound on
# how wrong its clock might be, and there is no way to that number in std.
libc = "0.2"

clap = { version = "4", features = ["derive"] }

# Dev
proptest = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A wire codec is mostly deliberate numeric conversions with locally proven
# bounds; the lint fires on nearly every line and hides the real findings.
cast_possible_truncation = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Release speed with symbols, for profiling the relay and latency harness.
[profile.profiling]
inherits = "release"
debug = true
panic = "unwind"

# Fuzzing and property tests are unusably slow on an unoptimised codec.
[profile.test]
opt-level = 1

# The transport is the one dependency where waiting on an upstream release is
# unacceptable, so it is vendored -- see vendor/quinn/VENDORED.md. The tree is
# byte-identical to the tag it records, and vendor/verify-quinn.sh proves both
# that and that this patch is actually in effect.
[patch.crates-io]
quinn = { path = "vendor/quinn/quinn" }
quinn-proto = { path = "vendor/quinn/quinn-proto" }
quinn-udp = { path = "vendor/quinn/quinn-udp" }
